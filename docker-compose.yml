services:
  postgres:
    image: postgres:18.4-alpine
    container_name: shopify-tanstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopify_tanstack_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
