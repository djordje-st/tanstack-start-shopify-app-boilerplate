name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide a minimum reproducible example and the exact steps you took.

  - type: input
    id: reproduction
    attributes:
      label: Minimum reproducible example
      description: Link to a small repository or project that reproduces the issue.
      placeholder: https://github.com/username/reproduction
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps taken
      description: List the exact steps and commands needed to reproduce the issue.
      placeholder: |
        1. Install dependencies with ...
        2. Run ...
        3. Open ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant error messages or logs.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, Node.js version, package manager version, and relevant dependency versions.
      placeholder: |
        OS: Ubuntu 24.04
        Node.js: 22.x
        pnpm: 10.x
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: The reproduction is minimal and does not contain secrets or private data.
          required: true
